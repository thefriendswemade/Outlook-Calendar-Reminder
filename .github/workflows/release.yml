name: Build release

# Push a tag like v1.0.0 to build the .exe and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller pywin32
      - run: .\build.bat
        shell: cmd
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/OutlookCalendarReminder.exe
